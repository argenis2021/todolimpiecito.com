<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Limpiecito | Catálogo de Productos</title>
    <!-- Fuente Inter para estilo minimalista -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #002B66;
            --primary-hover: #001f4d;
            --bg: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #1A1A1A;
            --text-muted: #666666;
            --border: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            max-width: 420px;
            width: 100%;
            padding: 40px 28px;
            text-align: center;
        }

        .logo-box {
            width: 84px;
            height: 84px;
            background-color: var(--primary);
            color: white;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            box-shadow: 0 6px 16px rgba(0, 43, 102, 0.2);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .location {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9CA3AF;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            margin-bottom: 14px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 43, 102, 0.25);
        }

        .btn-whatsapp {
            background-color: #F0FDF4;
            color: #166534;
            border: 1px solid #BBF7D0;
        }

        .btn-whatsapp:hover {
            background-color: #DCFCE7;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: #9CA3AF;
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo TL / Puedes reemplazar este div por un <img> con tu logo -->
        <div class="logo-box">TL</div>

        <!-- Título principal -->
        <h1>Todo Limpiecito</h1>
        <span class="location">Caracas, Venezuela</span>
        
        <p class="subtitle">Productos de limpieza y desinfección de calidad al mejor precio. Descarga nuestro catálogo actualizado.</p>

        <!-- Botón Principal: PDF -->
        <!-- REEMPLAZA EL href CON TU LINK PERMANENTE DE GOOGLE DRIVE O APPSHEET -->
        <a href="https://drive.google.com/file/d/1gNaicbGJGySSMs7UHlqKPAGI6lyPDRI-/view?usp=drive_link" class="btn btn-primary" target="_blank">
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Descargar Catálogo de Precios (PDF)
        </a>

        <!-- Botón Secundario: WhatsApp -->
        <a href="https://wa.me/584126334457?text=Hola,%20me%20gustaría%20solicitar%20información%20sobre%20sus%20productos." class="btn btn-whatsapp" target="_blank">
            <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
            </svg>
            Contactar por WhatsApp
        </a>

        <footer>
            &copy; <span id="year"></span> Todo Limpiecito. Todos los derechos reservados.
        </footer>
    </div>

    <script>
        // Actualiza automáticamente el año en el pie de página
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
